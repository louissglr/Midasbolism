name: env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - r-base >=4.3

  # reporting
  - quarto
  - r-rmarkdown
  - r-knitr
  - r-kableextra

  # data import
  - r-readr
  - r-readxl
  - r-data.table

  # tidyverse
  - r-dplyr
  - r-ggplot2
  - r-tibble
  - r-tidyverse

  # PCA plotting
  - r-ggfortify

  # UMAP
  - r-uwot

  #pcoa
  - r-vegan
  - r-ape
 
  #other
  - r-scales
  - r-hiclimr
  - r-ggrepel